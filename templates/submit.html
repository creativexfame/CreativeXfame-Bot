<!DOCTYPE html>
<html>
<head>
    <title>Submit Views - CreativeXfame</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .account {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .platform {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .username {
            color: #666;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .total-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .total {
            font-size: 28px;
            font-weight: bold;
        }

        .details {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .submit-btn {
            width: 100%;
            background: #5865F2;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: #4752C4;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #5865F2;
            text-decoration: none;
        }

        .error {
            background: #ffe5e5;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📤 Submit Views</h1>
        <p>
            Welcome, <strong>{{ username }}</strong>
        </p>
        <p>
            Enter the views for each of your registered accounts.
        </p>
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/submit">

        <h2>📱 Account Views</h2>

        {% for account in accounts %}

        <div class="account">

            <div class="platform">
                {{ account[1] }}
            </div>

            <div class="username">
                {{ account[2] }}
            </div>

            <label for="views_{{ account[0] }}">
                Views
            </label>

            <input
                type="number"
                id="views_{{ account[0] }}"
                name="views_{{ account[0] }}"
                min="0"
                step="1"
                value="0"
                required
                oninput="calculateTotal()"
            >

        </div>

        {% endfor %}


        <div class="total-box">

            <div>
                Total Views
            </div>

            <div class="total" id="totalViews">
                0
            </div>

        </div>


        <div class="details">

            <h2>📋 Submission Details</h2>

            <label for="whop_username">
                Whop Username
            </label>

            <input
                type="text"
                id="whop_username"
                name="whop_username"
                placeholder="Enter your Whop username"
                required
            >

            <br><br>

            <label for="google_drive_link">
                Google Drive Link
            </label>

            <input
                type="url"
                id="google_drive_link"
                name="google_drive_link"
                placeholder="https://drive.google.com/..."
                required
            >

            <button
                type="submit"
                class="submit-btn"
            >
                🚀 Submit Views
            </button>

        </div>

    </form>

    <a class="back" href="/accounts">
        ← Back to My Accounts
    </a>

</div>


<script>

function calculateTotal() {

    let total = 0;

    const inputs = document.querySelectorAll(
        'input[type="number"]'
    );

    inputs.forEach(function(input) {

        let value = parseInt(input.value) || 0;

        total += value;

    });

    document.getElementById("totalViews").innerText =
        total.toLocaleString();

}

</script>

</body>
</html>
